name: Release

on:
  push:
    tags:
      # Obsidian looks for a tag identical to manifest.json's version, so a
      # "v" prefix builds a release the directory can never find. GitHub's "*"
      # matches "v", hence the explicit exclusion.
      - "*.*.*"
      - "!v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag must match manifest version
        run: |
          manifest="$(jq -r .version manifest.json)"
          if [ "$manifest" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match manifest.json version $manifest" >&2
            exit 1
          fi
          if ! jq -e --arg v "$GITHUB_REF_NAME" 'has($v)' versions.json >/dev/null; then
            echo "versions.json has no entry for $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Tag must be on the default branch
        run: |
          # The directory reads manifest.json from the default branch's HEAD and
          # only then fetches the identically-tagged release, so a tag on a side
          # commit yields a green release nobody is ever offered.
          git fetch origin main --quiet
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify build outputs exist
        run: |
          test -f main.js
          test -f manifest.json
          test -f styles.css

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            main.js
            manifest.json
            styles.css
          generate_release_notes: true
